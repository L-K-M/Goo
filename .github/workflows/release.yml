# Release: a pushed v* tag builds, verifies, and publishes the release APK.
#
# Signing: BOTH build types are signed with the checked-in app/debug.keystore —
# zero secrets, reproducible by anyone, deliberately sideload-only
# (docs/decisions/0002). Switching to a real key later breaks upgrades for
# every installed user, which is why this was decided on day one.
#
# Hardening (family contract): least-privilege permissions, no cancellation
# (a half-cancelled publish is worse than a slow one), timeout, wrapper
# validation before any Gradle execution, and a tag↔versionName gate so a tag
# can only publish the version the commit actually declares.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # The committed versionName at the tagged commit is the source of truth;
      # the tag only names the Release. Same sed pattern scripts/release.sh's
      # engine writes with, so this gate accepts everything the bumper produces.
      - name: Verify tag matches committed versionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "!! tag v$VERSION does not match committed versionName $COMMITTED" >&2
            echo "!! re-cut the release with scripts/release.sh" >&2
            exit 1
          fi

      # Re-prove the tagged commit: a tag can land on a commit CI never saw.
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/goo-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "goo-${GITHUB_REF_NAME}.apk" > "goo-${GITHUB_REF_NAME}.apk.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Goo ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.sha256
